<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>매직 위즈파크</title>
<meta name="description" content="위즈파크를 걸으며 한국시리즈를 함께 응원하는 비공식 팬 공간">
<meta property="og:title" content="매직 위즈파크">
<meta property="og:description" content="함께 들어와 한국시리즈를 응원해요">
<meta property="og:type" content="website">
<meta property="og:image" content="https://wiz.gohaeyaji.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout concept: the 3D ballpark fills the screen; a stadium-issue scorebug and a slim equipment dock sit on top like a broadcast overlay */
:root{
  color-scheme:dark;
  --night:#0d0a17; --panel:#17111fe8; --line:#ffffff24; --ink:#f8f2ea; --dim:#b9aec6;
  --kt-red:#e3122c; --spell:#8f5bff; --gold:#ffc861;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
body.gated .hud{visibility:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}

#bug{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-variant-numeric:tabular-nums;max-width:calc(100vw - 16px)}
#bug .team{display:flex;align-items:center;gap:8px;padding:6px 10px;font-family:var(--display);font-size:16px;white-space:nowrap}
#bug .team b{font-weight:400;font-size:24px;color:var(--gold);min-width:1.2em;text-align:center}
#bug .home{background:#e3122c33}
#bug .inn{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:4px 10px;border-inline:1px solid var(--line);min-width:64px;text-align:center}
#innText{font-weight:700;font-size:13px;white-space:nowrap}
#bso{display:flex;gap:6px;justify-content:center;font-size:10px;color:var(--dim)}
#bso span{display:flex;gap:2px;align-items:center}
#bso i{width:6px;height:6px;border-radius:50%;background:#ffffff26}
#bso i.b{background:#4be38b}#bso i.s{background:var(--gold)}#bso i.o{background:#ff3b3b}
#bases{width:42px;padding:0 6px;display:block;align-self:center}

#mode{top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:12px;padding:3px 10px;border-radius:99px;background:#0009;color:var(--dim);white-space:nowrap}
#online{top:calc(14px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));font-size:12px;padding:4px 10px;border-radius:99px;background:#0009}
#online.score{border-radius:10px;padding:6px 10px 5px;min-width:210px;box-sizing:border-box}
#online .scRow{display:flex;align-items:center;gap:6px}#online .scT{font:400 13px "Black Han Sans",sans-serif;padding:1px 5px;border-radius:4px}#online .scT.kt{background:#e3122c}#online .scT.ss{background:#0a56b5}
#online i{font:400 15px "Black Han Sans",sans-serif;font-style:normal;min-width:30px;text-align:center}
#online .tug{flex:1;min-width:60px;height:7px;border-radius:4px;background:#0a56b5;overflow:hidden}#online .tug span{display:block;height:100%;background:#e3122c;transition:width .6s}
#online small{display:block;margin-top:3px;font-size:10.5px;color:#d4c9df;white-space:pre}
#online.pulse{animation:scPulse .5s}#online.won small{color:var(--gold);font-weight:700}
@keyframes scPulse{40%{box-shadow:0 0 0 2px var(--gold)}}@media (prefers-reduced-motion:reduce){#online.pulse{animation:none}}
#bench{top:calc(92px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;max-width:calc(100vw - 16px)}#benchJoin{padding:7px 12px;border-radius:5px;background:var(--kt-red);font-weight:700}
#joystick{left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;box-sizing:border-box;background:#0000004d;border:2px solid #ffffff66;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#joystick[hidden]{display:none}#joystick.on{background:#00000080}#joystick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--gold);box-shadow:0 2px 8px #0006;opacity:.9;transition:transform .1s}#joystick.on i{transition:none}
#song{left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:208px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}#songHead{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 3px 9px;font-size:12px;font-weight:600}#songOff{width:28px;height:28px}#ytBox{width:208px;height:200px}#ytBox iframe,#ytBox div{width:100%;height:100%;border:0}
#teamPick{display:flex;gap:6px;margin:12px 0 2px}#teamPick button{flex:1;padding:9px 6px;border-radius:5px;background:#ffffff14;font-size:13px;font-weight:600}#teamPick button[aria-pressed=true]{background:var(--kt-red)}
#mode b{color:var(--gold);font-weight:600}




#dock{left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:calc(100vw - 12px)}
#dock button{min-width:60px;min-height:48px;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:600;line-height:1.2;white-space:nowrap}
#dock button kbd{display:block;font:400 10px var(--body);color:var(--dim)}
#dock button:hover,#dock button[aria-expanded=true]{background:#ffffff1c}
#dock #cheer{background:var(--kt-red);font-family:var(--display);font-weight:400;font-size:17px;min-width:86px}
#dock #cheer:active{transform:scale(.96)}
#dock #trainBtn{color:var(--gold)}

#drawer{right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(372px,calc(100vw - 20px));max-height:min(58vh,520px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#drawerClose{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;font-size:17px;line-height:1;color:var(--ink)}
#drawerClose:hover{background:#ffffff1c}
#drawer h2{padding-right:48px;margin:0;padding:10px 14px 2px;font:400 19px var(--display)}
#drawer p{margin:0;padding:0 14px 8px;font-size:12px;color:var(--dim)}
#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;gap:6px;padding:4px 10px 12px;overflow:auto;min-height:0}
#benchHot{grid-column:1/-1;min-height:98px;flex:none;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:13px 14px;border:2px solid var(--gold);border-radius:8px;background:linear-gradient(115deg,#7d0a1e,#e3122c 48%,#ff7a18);color:#fff;text-align:left;box-shadow:0 0 18px #ff425966;animation:hotGlow 1.3s ease-in-out infinite}
#benchHot i{font-style:normal;font-size:11px;font-weight:700;color:#ffe9b0}
#benchHot b{font:400 25px/1.1 "Black Han Sans",sans-serif;letter-spacing:.3px;animation:hotShake 2.6s infinite}
#benchHot span{font-size:12px;font-weight:600}
#benchHot::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff55 50%,transparent 60%);transform:translateX(-100%);animation:hotShine 2.6s infinite;pointer-events:none}
#benchHot:hover:enabled{filter:brightness(1.12)}#benchHot.call{animation-duration:.55s}
#benchHot:disabled{filter:saturate(.35) brightness(.72);animation:none;box-shadow:none;border-color:var(--line)}#benchHot:disabled b,#benchHot:disabled::after{animation:none}
#actBtn{position:relative}#actBtn.hot::after{content:'난입';position:absolute;top:-8px;right:2px;padding:1px 5px;border-radius:7px;background:#e3122c;color:#fff;font-size:10px;font-weight:700;line-height:1.35;animation:hotBadge 1.1s ease-in-out infinite}#actBtn.call{background:#e3122c66}
#benchJoin{background:#e3122c;color:#fff;font-weight:700;animation:hotGlow .7s ease-in-out infinite}
@keyframes hotGlow{50%{box-shadow:0 0 30px #ffc861cc}}@keyframes hotShine{55%,100%{transform:translateX(100%)}}@keyframes hotShake{0%,84%,100%{transform:none}87%{transform:rotate(-1.4deg) scale(1.04)}91%{transform:rotate(1.4deg) scale(1.04)}95%{transform:rotate(-.8deg)}}@keyframes hotBadge{50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){#benchHot,#benchHot b,#benchHot::after,#actBtn.hot::after,#benchJoin{animation:none}}
.backEdit{grid-column:1/-1;display:grid;grid-template-columns:1fr 76px;gap:8px;padding:2px 2px 8px}.backEdit label{display:block;font-size:11px;color:var(--dim)}.backEdit input{width:100%;box-sizing:border-box;margin-top:3px;padding:8px 10px;background:#ffffff14;border:1px solid var(--line);border-radius:5px;color:#fff}
.volRow{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 1.4fr 34px;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}.volRow span b{display:block;font-size:14px}.volRow small{font-size:11px;color:var(--dim)}.volRow input{width:100%;accent-color:var(--gold)}.volRow output{font-size:13px;text-align:right}.volAll{grid-column:1/-1;justify-content:center}#soundBtn.muted{opacity:.6;text-decoration:line-through}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:5px;border:1px solid transparent;font-size:12px;line-height:1.25;text-align:center;min-width:0}
.pick:hover{background:#ffffff14}
.pick[aria-pressed=true]{border-color:var(--gold);background:#ffc86118}
.pick canvas{width:100%;max-width:96px;aspect-ratio:1;border-radius:4px}
.pick small{color:var(--dim);font-size:10px}
.tabs{grid-column:1/-1;display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;min-height:40px;box-sizing:border-box}
.tab{flex:none;padding:6px 10px;border-radius:99px;font-size:12px;background:#ffffff14;min-height:32px}
.tab[aria-pressed=true]{background:var(--kt-red);font-weight:700}
.teamTabs .tab{flex:1;font-size:13px;font-weight:700;min-height:36px}
#grid .note{grid-column:1/-1;padding:4px 2px;font-size:11px}
.pick.seat{align-items:flex-start;text-align:left;padding:9px;grid-column:span 3}


#gate{position:fixed;inset:0;z-index:10;overflow:auto;display:flex;align-items:flex-end;justify-content:flex-start;padding:max(28px,4vw);background:linear-gradient(75deg,#0b0813e6 18%,#0b081300 72%);transition:opacity .5s}
#gate.off{opacity:0;pointer-events:none}
#gateBox{max-width:440px}
#gate h1{margin:0;font:400 clamp(34px,min(9vw,12vh),84px)/.98 var(--display);text-wrap:balance}
#gate h1 em{font-style:normal;color:var(--kt-red);text-shadow:0 0 28px #e3122c}
#gate p{font-size:15px;line-height:1.6;margin:12px 0 16px;color:#e9e0f0}
#gate label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
#scoreFx{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;text-align:center;padding:14px 34px 12px;border-radius:14px;color:#fff;animation:fxIn 3.6s cubic-bezier(.2,1.4,.4,1) both}
#scoreFx b{display:block;font:400 clamp(44px,11vw,96px)/1 "Black Han Sans",sans-serif;letter-spacing:1px;text-shadow:0 4px 0 #000b,0 0 3px #000,0 0 10px #000c,0 0 30px var(--gold);-webkit-text-stroke:1.5px #0008}
#scoreFx span,#scoreFx small{text-shadow:0 2px 3px #000,0 0 8px #000c}
#scoreFx span{display:block;margin-top:6px;font:400 clamp(17px,4vw,26px) "Black Han Sans",sans-serif}#scoreFx small{display:block;margin-top:4px;font-size:13px;opacity:.85}
#scoreFx.mine{background:radial-gradient(ellipse at center,#000000b0,#0000 72%)}#scoreFx.mine b{color:var(--gold)}
#scoreFx.theirs{animation-duration:2.6s;background:#000a;padding:8px 20px}#scoreFx.theirs b{font-size:clamp(24px,6vw,40px);text-shadow:none;color:#d4c9df}#scoreFx.theirs span{font-size:15px}
@keyframes fxIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}16%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
@media (prefers-reduced-motion:reduce){#scoreFx{animation:none}}
#innPick{min-height:38px;padding:3px 6px;background:#2a2036;color:#fff;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px}#numPick,#editPick{width:100%;box-sizing:border-box;padding:9px 10px;margin-bottom:10px;background:#2a2036;color:#fff;border:1px solid var(--line);border-radius:5px;font:inherit;font-size:13px}#editPick{margin:3px 0 0}#gate .backRow{display:grid;grid-template-columns:1fr 76px;gap:8px}#numIn{text-align:center}#numIn{width:100%;box-sizing:border-box;padding:11px 12px;margin-bottom:10px;background:#ffffff14;border:1px solid var(--line);border-radius:5px}
#enter{width:100%;padding:13px;border-radius:5px;background:var(--kt-red);font:400 20px var(--display)}
#gate footer{margin-top:12px;font-size:11px;line-height:1.5;color:var(--dim)}

@media (max-width:860px){
  #online{top:calc(90px + env(safe-area-inset-top,0px))}
  #dock{display:grid;grid-template-columns:1.3fr repeat(5,minmax(0,1fr));width:calc(100vw - 12px);box-sizing:border-box}
  #dock button{min-width:0;min-height:38px;padding:3px 2px;font-size:11.5px;white-space:normal;word-break:keep-all}
  #dock #cheer{min-width:0;order:-1;grid-row:span 2;font-size:19px}
  #dock kbd{display:none!important}
  #drawer{bottom:calc(120px + env(safe-area-inset-bottom,0px));max-height:min(54vh,520px)}
  #bench{top:calc(152px + env(safe-area-inset-top,0px))}
  #song{top:calc(210px + env(safe-area-inset-top,0px));bottom:auto}
}
/* the cheer player sits on the left here, so the stick moves to the right */
@media (min-width:861px),(max-height:520px){#joystick{left:auto;right:calc(16px + env(safe-area-inset-right,0px))}}
</style>

<div id="stage" aria-label="3D 야구장"></div>

<div id="bug" class="hud" role="status" aria-label="현재 점수">
  <div class="team"><span id="awayName">원정</span><b id="awayScore">0</b></div>
  <div class="inn"><span id="innText">경기 전</span><div id="bso">
    <span>B<i></i><i></i><i></i></span><span>S<i></i><i></i></span><span>O<i></i><i></i></span></div></div>
  <svg id="bases" viewBox="0 0 40 30" aria-hidden="true"></svg>
  <div class="team home"><b id="homeScore">0</b><span id="homeName">홈</span></div>
</div>
<div id="mode" class="hud"></div>
<div id="online" class="hud" hidden></div>
<aside id="song" class="hud" hidden aria-label="응원가"><div id="songHead"><span id="songName"></span><button id="songOff" aria-label="응원가 닫기">✕</button></div><div id="ytBox"></div></aside>
<div id="bench" class="hud" hidden role="status"><span id="benchText"></span><button id="benchJoin">난입하기</button></div>
<div id="joystick" class="hud" hidden aria-hidden="true"><i></i></div>
<section id="drawer" class="hud" hidden aria-label="선택 패널"><button id="drawerClose" aria-label="닫기">✕</button><h2 id="drawerT"></h2><p id="drawerS"></p><div id="grid"></div></section>
<nav id="dock" class="hud" aria-label="메뉴">
  <button id="wardBtn" aria-expanded="false">유니폼<kbd>U</kbd></button>
  <button id="gearBtn" aria-expanded="false">응원도구<kbd>G</kbd></button>
  <button id="cheer">응원!<kbd>Space</kbd></button>
  <button id="msgBtn" aria-expanded="false">응원 메시지<kbd>C</kbd></button>
  <button id="actBtn" aria-expanded="false">격한 응원<kbd>X</kbd></button>
  <button id="seatBtn" aria-expanded="false">자리 이동<kbd>T</kbd></button>
  <button id="trainBtn">선수 특훈<kbd>K</kbd></button>
  <select id="innPick" hidden aria-label="재연할 회 고르기"></select>
  <button id="gameBtn" hidden aria-pressed="true">내 캐릭터 보기<kbd>V</kbd></button>
  <button id="boardBtn" aria-pressed="false">전광판 보기<kbd>B</kbd></button>
  <button id="songBtn" aria-pressed="true">응원가 끄기<kbd>L</kbd></button>
  <button id="soundBtn" aria-expanded="false">소리 설정<kbd>M</kbd></button>
</nav>

<div id="scoreFx" hidden aria-live="polite"><b></b><span></span><small></small></div>
<section id="gate">
  <div id="gateBox">
    <h1><span id="titleA"></span><br><em id="titleB"></em></h1>
    <div id="teamPick" role="group" aria-label="내 응원 팀 선택"><button id="pickKt">KT 위즈 팬</button><button id="pickSs">삼성 라이온즈 팬</button></div>
    <p id="gateInfo"></p>
    <div class="backRow"><div><label for="numPick">유니폼 선수</label><select id="numPick"></select></div><div><label for="numIn">등번호</label><input id="numIn" inputmode="numeric" maxlength="2" autocomplete="off"></div></div>
    <button id="enter">입장하기</button>
    <footer>팬이 만든 비공식 페이지입니다. 구단, KBO와 관련이 없고 구단 로고와 마스코트는 쓰지 않습니다.</footer>
  </div>
</section>

<script>
'use strict';
/* ---------- content ---------- */
/* e:1 = base colour stated in an article or official product name; e:0 = base colour partly assumed.
   Marks and logos are never reproduced; only colours and described traits are reinterpreted. */
const UNIFORM_CATS=[['all','전체'],['home','홈, 원정'],['jeongjo','정조대왕'],['retro','역대'],['military','밀리터리'],['season','시즌, 이벤트'],['fashion','패션']];
const KT_UNIFORMS=[
 {id:'found-home',c:'home',e:0,n:'창단 홈',t:'2013 공개',body:'#c80f27',sleeve:'#141018',trim:'#141018',pants:'#141018',cap:'#141018',text:'#ffffff',p:'yoke'},
 {id:'found-away',c:'home',e:0,n:'창단 원정',t:'2013 공개',body:'#141018',sleeve:'#c80f27',trim:'#c80f27',pants:'#2b2830',cap:'#141018',text:'#ffffff',p:'yoke'},
